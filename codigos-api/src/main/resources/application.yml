server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

similaridade:
  url: ${SIMILARIDADE_URL:http://127.0.0.1:8000}

mokka:
  so-chave: ${MOKKA_SO_CHAVE:false}
  segredo: ${MOKKA_SEGREDO:}
  admins: ${MOKKA_ADMINS:Leonardo Lopes,Thales,Thirza,Bárbara,Lukas}
  chave-fotos: ${MOKKA_CHAVE_FOTOS:../.ferramentas/chave-fotos.key}
  dados: ${MOKKA_DADOS:}

springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

spring:
  application:
    name: codigos-api
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:h2:mem:codigos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    property-naming-strategy: SNAKE_CASE
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/mokka}
    username: ${DB_USER:mokka_app}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      continue-on-error: false
  h2:
    console:
      enabled: false
