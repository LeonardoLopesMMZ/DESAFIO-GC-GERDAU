services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: codigos
      POSTGRES_USER: codigos
      POSTGRES_PASSWORD: codigos
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - dados:/var/lib/postgresql/data
volumes:
  dados:
